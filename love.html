<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>For You</title>
    <style>        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        color: #fff;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
    }

    .stars::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        box-shadow: 100px 50px #fff, 200px 150px #fff, 300px 80px #fff, 400px 200px #fff, 500px 100px #fff, 600px 250px #fff;
        animation: twinkle 5s infinite alternate;
    }

    @keyframes twinkle {
        0% {
            opacity: 0.5;
        }
        100% {
            opacity: 1;
        }
    }

    .container {
        text-align: center;
        padding: 20px;
        max-width: 800px;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
    }

    .typewriter {
        font-size: 1.5rem;
        line-height: 2;
        min-height: 100px;
        margin-bottom: 40px;
    }

    .typewriter .cursor {
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0;
        }
    }

    /* 3D 相册样式 */
    .photo-gallery {
        width: 300px;
        height: 250px;
        perspective: 1000px;
        margin: 0 auto;
    }

    .carousel {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: rotate3d 15s infinite linear;
    }

    .carousel:hover {
        animation-play-state: paused;
    }

    .photo-frame {
        width: 200px;
        height: 250px;
        position: absolute;
        left: 50px;
        border: 5px solid #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background: #eee;
        backface-visibility: hidden;
    }

    .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    @keyframes rotate3d {
        from {
            transform: rotateY(0deg);
        }
        to {
            transform: rotateY(360deg);
        }
    }

    .heart {
        position: fixed;
        top: -10%;
        color: #ff6b81;
        font-size: 20px;
        animation: fall linear infinite;
        z-index: -1;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }    </style>
</head>
<body>
<div class="stars"></div>
<div class="container"><h1>致 []</h1>
    <div class="typewriter"><span id="text"></span><span class="cursor">|</span></div>
    <div class="photo-gallery">
        <div class="carousel">
            <div class="photo-frame" style="transform: rotateY(0deg) translateZ(300px);"><img alt="Our Memory"
                                                                                              src="photos/同学效果/photo1.jpg">
            </div>
            <div class="photo-frame" style="transform: rotateY(60deg) translateZ(300px);"><img alt="Beautiful Moment"
                                                                                               src="photos/同学效果/photo2.jpg">
            </div>
            <div class="photo-frame" style="transform: rotateY(120deg) translateZ(300px);"><img alt="Future Expectation"
                                                                                                src="photos/同学效果/photo3.jpg">
            </div>
            <div class="photo-frame" style="transform: rotateY(180deg) translateZ(300px);"><img alt="Our Memory"
                                                                                                src="photos/同学效果/photo4.jpg">
            </div>
            <div class="photo-frame" style="transform: rotateY(240deg) translateZ(300px);"><img alt="Beautiful Moment"
                                                                                                src="photos/同学效果/photo5.jpg">
            </div>
            <div class="photo-frame" style="transform: rotateY(300deg) translateZ(300px);"><img alt="Future Expectation"
                                                                                                src="photos/同学效果/photo6.jpg">
            </div>
        </div>
    </div>
</div>
<script>    const loveWords = "遇见你是我最美丽的意外。\n从那天起，我的世界因为你而变得闪闪发光。\n无论未来有多远，我都想牵着你的手一起走。\n我爱你，不止今天。";
const textElement = document.getElementById('text');
let index = 0;

function typeWriter() {
    if (index < loveWords.length) {
        if (loveWords.charAt(index) === '\n') {
            textElement.innerHTML += '<br>';
        } else {
            textElement.innerHTML += loveWords.charAt(index);
        }
        index++;
        setTimeout(typeWriter, 100);
    }
}

setTimeout(typeWriter, 1000);

function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
    heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}

setInterval(createHeart, 300);</script>
</body>
</html>22
